name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          # Install the project itself so `import congress_api` resolves. requirements.txt
          # does not include the package, and the bare `pytest` console script does not
          # put the repo root on sys.path (only `python -m pytest` does) -- without this,
          # the test files that lack a sys.path shim fail at collection. --no-deps keeps
          # the versions pinned above; -e . just makes the package importable.
          pip install -e . --no-deps

      - name: Run test suite
        env:
          CONGRESS_API_KEY: ci-placeholder-key
        run: |
          # The suite carries a known-failing baseline (legacy hosted-SaaS
          # registration/email tests, and hub-bucket tests importing a package/module
          # that no longer exist); see tests/KNOWN_FAILURES.md. check_known_failures.py
          # runs the WHOLE suite and exits 0 iff the live failing set exactly equals that
          # baseline -- so a new failure (regression) OR a silently-fixed one both fail
          # the build. This replaces a hand-maintained --ignore list that omitted
          # test_bucket_double_conversion.py (4 baseline failures), which made every run
          # exit non-zero regardless of the code under test.
          python tests/check_known_failures.py

      - name: Audit tool schemas for drift
        env:
          CONGRESS_API_KEY: ci-placeholder-key
        run: python scripts/audit_tool_schemas.py --check
